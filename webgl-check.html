<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hero water — device check</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#111;color:#eee;font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:18px}
  h1{font-size:19px;margin-bottom:4px}
  .sub{color:#999;font-size:13px;margin-bottom:18px}
  .verdict{padding:14px;border-radius:10px;font-weight:600;margin-bottom:18px;font-size:16px}
  .ok{background:#12351d;color:#7ee29b;border:1px solid #2c6b41}
  .bad{background:#3a1518;color:#ff9b9b;border:1px solid #7a2a30}
  table{width:100%;border-collapse:collapse}
  td{padding:9px 6px;border-bottom:1px solid #262626;vertical-align:top;font-size:14px}
  td:first-child{color:#9a9a9a;width:52%}
  td:last-child{text-align:right;font-family:ui-monospace,Menlo,monospace;word-break:break-word}
  .P{color:#7ee29b}.F{color:#ff9b9b}.N{color:#e8c07a}
  .r{margin-top:16px;padding:12px;background:#1b1b1b;border-radius:8px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#bbb;word-break:break-all}
  .hint{margin-top:18px;color:#888;font-size:13px}
</style>
</head>
<body>
<h1>Hero water — device check</h1>
<div class="sub">Screenshot this whole page and send it.</div>
<div id="verdict" class="verdict">Running…</div>
<table id="t"></table>
<div class="r" id="renderer">renderer: …</div>
<div class="hint">This page only reads your browser's graphics capabilities. Nothing is uploaded or stored.</div>

<video id="v" muted loop playsinline preload="auto" style="position:fixed;left:-9999px;width:80px;height:45px">
  <source src="hero.mp4" type="video/mp4">
</video>

<script>
(function () {
  var rows = [], blockers = [];
  function add(label, value, state) { rows.push([label, value, state || '']); }

  // ---- what the effect actually requires, in the same order the real module checks it ----
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  add('Reduce Motion is OFF', reduce ? 'NO — motion reduced' : 'yes', reduce ? 'F' : 'P');
  if (reduce) blockers.push('"Reduce Motion" is turned on in your device settings. The effect is disabled on purpose when that is on. Settings > Accessibility > Motion.');

  var cv = document.createElement('canvas');
  var gl = cv.getContext('webgl2', { alpha: false, depth: false, stencil: false, antialias: false });
  add('WebGL2 supported', gl ? 'yes' : 'NO', gl ? 'P' : 'F');
  if (!gl) blockers.push('This browser has no WebGL2. On iPhone that usually means iOS 14 or older — updating iOS fixes it.');

  var full = false, half = false, complete = false, renderer = 'n/a';
  if (gl) {
    full = !!gl.getExtension('EXT_color_buffer_float');
    half = !!gl.getExtension('EXT_color_buffer_half_float');
    add('Float render targets', (full ? 'full' : '—') + (half ? (full ? ' + half' : 'half only') : (full ? '' : ' NONE')),
        (full || half) ? 'P' : 'F');
    if (!full && !half) blockers.push('This GPU cannot render to floating-point textures, which the water simulation needs. The effect cannot run here.');

    // the decisive test: is RGBA16F actually renderable on THIS gpu?
    try {
      var t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA16F, 64, 64);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      var f = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, f);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
      complete = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    } catch (e) { complete = false; }
    add('RGBA16F target usable', complete ? 'yes' : 'NO', complete ? 'P' : 'F');
    if (!complete && (full || half)) blockers.push('The GPU reports float support but will not actually render to the format the simulation uses. This is a driver limitation.');

    var dbg = gl.getExtension('WEBGL_debug_renderer_info');
    renderer = dbg ? String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '') : 'hidden by browser';
  }

  add('Screen size', window.innerWidth + ' x ' + window.innerHeight);
  add('Pixel ratio', String(window.devicePixelRatio || 1));
  add('Hero wide enough (200px+)', window.innerWidth >= 200 ? 'yes' : 'NO', window.innerWidth >= 200 ? 'P' : 'F');

  function render() {
    var html = '';
    for (var i = 0; i < rows.length; i++) {
      html += '<tr><td>' + rows[i][0] + '</td><td class="' + rows[i][2] + '">' + rows[i][1] + '</td></tr>';
    }
    document.getElementById('t').innerHTML = html;
    document.getElementById('renderer').textContent =
      'renderer: ' + renderer + '\nbrowser: ' + navigator.userAgent;

    var el = document.getElementById('verdict');
    if (blockers.length) {
      el.className = 'verdict bad';
      el.innerHTML = 'Effect cannot run here.<br><br>' + blockers.join('<br><br>');
    } else {
      el.className = 'verdict ok';
      el.textContent = 'This device can run the effect. If you still see no ripples on the site, the problem is in the page rather than the device — send this screenshot.';
    }
  }

  // ---- video autoplay: the remaining phone-specific blocker ----
  var v = document.getElementById('v');
  var settled = false;
  function settle() {
    if (settled) return; settled = true;
    var ok = v.readyState >= 2 && v.videoWidth > 0;
    add('Background video plays', ok ? 'yes (' + v.videoWidth + 'x' + v.videoHeight + ')' : 'NO — blocked or still loading', ok ? 'P' : 'F');
    if (!ok) blockers.push('The hero video did not start. The water effect is built from that video, so it cannot appear without it. On iPhone this is usually Low Power Mode — turn it off and reload.');
    render();
  }
  v.addEventListener('loadeddata', settle);
  v.addEventListener('playing', settle);
  var p = v.play(); if (p && p.catch) p.catch(function () {});
  setTimeout(settle, 4000);   // decide either way rather than hanging

  render();
})();
</script>
</body>
</html>
